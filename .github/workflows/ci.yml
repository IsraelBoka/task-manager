name: CI

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build app
        run: npm run build

      # Login to GitHub Container Registry
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: israelboka
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push Docker image
      - name: Build & Push
        run: |
          docker build -t ghcr.io/israelboka/task-manager:latest .
          docker push ghcr.io/israelboka/task-manager:latest
